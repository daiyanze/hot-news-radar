# tripple-signals 配置示例。复制为 config.yaml 后修改：
#   cp config.example.yaml config.yaml
# 加载顺序：config.yaml > config.yml > config.json > 本文件。
# 装了 PyYAML 时用完整 YAML；没装时用内置子集解析器（仅标准库即可运行），
# 子集支持：缩进映射、列表、行内 [a, b] / {k: v}、引号字符串、注释；
# 不支持锚点与多行字符串。所有选项不填都用默认行为，老 config.json 照常可读。

language: zh-CN
timezone: Asia/Tokyo
state_file: state/seen-topics.json

# 期次：频度由使用者自行定义（程序也可自行发现并更新），这里只是示例。
editions:
  - name: morning
    label: 早报
    time: "06:00"
    focus: 欧美夜间发酵结果 + L1 源头层新面孔
  - name: evening
    label: 晚报
    time: "18:00"
    focus: 亚洲白天 + 欧美清晨；发酵确认、苗头增速复查、今日变化

# ---- 用户可控选项（0.4.0） ----

# 关键词三件套：子串匹配（不分大小写），作用在候选的标题+摘要上。
keywords:
  # 屏蔽词：命中直接丢弃（减法）。放你不想再看到的东西。
  mute: []
    # 例：- giveaway
    # 例：- airdrop
  # 关注词：命中打标，agent 分级时可把单源苗头升为关注（加法）。
  boost: []
    # 例：- mcp
  # 必看词：命中且有第二源共振时，agent 直接列为必看候选。只放极少数词。
  alert: []
    # 例：- gemini

# 主题权重（1-5）：相关性打分按这里的优先级，不再是沾边/不沾边的二值。
# 换行业主要改这一节。兼容旧写法 grading.relevance_topics（平铺列表，权重按 1）。
topics:
  AI Agents: 5
  独立产品: 4
  开发者工具: 4
  内容创作: 3
  社会观察: 2

filters:
  # 新鲜度窗口（小时）：只对带可解析时间戳的候选生效（arXiv、RSS、
  # Bluesky 等有；没有时间戳的候选不拦）。null = 不过滤。
  max_age_hours: null

vocab:
  # 新词词汇表（0.5.0）：实体型源（GitHub / HF / OpenRouter / Civitai /
  # Product Hunt / 目录站 / App Store）的名字若在 window_days 天内没在
  # 候选流里出现过，打上 "novel": true。第一次运行只建基线、不打标。
  # 状态文件 state/vocab.json；enabled: false 可关。
  window_days: 60
  state_file: state/vocab.json

grading:
  levels: [必看, 关注, 苗头]
  min_sources_for_hotspot: 2
  max_items_per_report: 8
  max_seedlings: 3
  relevance_topics: [AI Agents, 独立产品, 开发者工具, 内容创作, 社会观察]

review:
  after_days: 14
  baseline_multiplier: 2
  min_points: 10
  rule: 话题被报告 14 天后回看：搜索热度峰值超过报告前基线 baseline_multiplier 倍且至少 min_points 点 = 命中

# 信息源。每个源都可加两个通用键：
#   enabled: false   # 关掉这个源（报告里单列「已停用」，不算缺失）
#   max_items: 20    # 抓完后最多保留多少条（与各源自己的 limit 参数不同，
#                    # limit 是抓取参数，max_items 是统一截断）
sources:
  x:
    layer: 1
    accounts: []
    min_accounts: 2
    min_likes_single: 100
    rule: 一个新名字被 >=2 个有影响力账号独立提到才算信号；单账号提及需 min_likes_single
  official_blogs:
    layer: 1
    per_feed: 5
    rule: 实验室/公司官方博客一手公告；整组只算一个源，防止自家通稿冒充多源共振
    feeds:
      - {name: "OpenAI News", url: "https://openai.com/news/rss.xml"}
      - {name: "Google DeepMind", url: "https://deepmind.google/blog/rss.xml"}
      - {name: "Google Research", url: "https://research.google/blog/rss/"}
      - {name: "Hugging Face Blog", url: "https://huggingface.co/blog/feed.xml"}
      - {name: "Mistral AI", url: "https://mistral.ai/news/rss"}
      - {name: "NVIDIA Blog", url: "https://blogs.nvidia.com/feed/"}
      - {name: "AWS Machine Learning", url: "https://aws.amazon.com/blogs/machine-learning/feed/"}
      - {name: "GitHub Blog · AI & ML", url: "https://github.blog/ai-and-ml/feed/"}
      - {name: "BAIR", url: "https://bair.berkeley.edu/blog/feed.xml"}
  github:
    layer: 1
    max_age_days: 14
    min_stars_per_day: 200
    min_stars_delta: 400
    rule: 爆发仓库：创建天数 <= max_age_days 且日均 stars >= min_stars_per_day，或单日增量 >= min_stars_delta
  hackernews:
    layer: 1
    rule: 首页或高分新帖
  show_hn:
    layer: 1
    rule: Show HN 发布帖：独立产品自发布的第一现场
  huggingface:
    layer: 1
    top_n: 50
    rule: Trending models / Spaces 前 50 里的新面孔
  hf_spaces:
    layer: 1
    top_n: 50
    rule: Trending Spaces 前 50 里的新面孔（人们真正上手试的 demo）
  openrouter:
    layer: 1
    limit: 30
    new_days: 14
    rule: 最新上架模型按创建时间排序；new_days 内上架标 is_new
  civitai:
    layer: 1
    limit: 20
    rule: 最新社区模型（仅 SFW）；某基座突然被大量微调 = 扩散信号
  arxiv:
    layer: 1
    categories: [cs.AI, cs.CL, cs.LG]
    max_results: 30
    rule: 最新提交的论文：新方法/新模型名的最早出处之一
  daily_papers:
    layer: 1
    limit: 30
    rule: HF 社区票选论文：arXiv 的已筛选版，与 arXiv 互补
  bluesky:
    layer: 1
    per_account: 10
    rule: 关键账号的公开 RSS（免 key 读 Bluesky 的唯一路）；整组只算一个源
    accounts:
      - simonwillison.net
      - karpathy.bsky.social
      - gdb.bsky.social
      - techcrunch.com
      - theverge.com
      - wired.com
      - arstechnica.com
  producthunt:
    layer: 1
    rule: 当日新品；无 token 时走公开 Atom feed（无票数）
  reddit:
    layer: 2
    subreddits: [all, artificial, LocalLLaMA, SideProject, technology]
    rule: rising/热帖前列；特别留意 'is there a tool that…' 式说出口的需求
  tech_media:
    layer: 2
    per_feed: 5
    rule: 科技媒体 + 独立作者；整组只算一个源，多家转述同一件事不算多源共振
    feeds:
      - {name: "TechCrunch · AI", url: "https://techcrunch.com/category/artificial-intelligence/feed/"}
      - {name: "The Verge · AI", url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"}
      - {name: "Ars Technica · AI", url: "https://arstechnica.com/ai/feed/"}
      - {name: "MIT Technology Review · AI", url: "https://www.technologyreview.com/topic/artificial-intelligence/feed"}
      - {name: "The Decoder", url: "https://the-decoder.com/feed/"}
      - {name: "Simon Willison", url: "https://simonwillison.net/atom/everything/"}
      - {name: "Import AI", url: "https://importai.substack.com/feed"}
      - {name: "Latent Space", url: "https://www.latent.space/feed"}
  devto:
    layer: 2
    top_days: 1
    per_page: 30
    rule: 开发者社区热文（top 当日）
  lobsters:
    layer: 2
    rule: hottest 列表；与 HN 互为发酵交叉验证
  mastodon:
    layer: 2
    instance: mastodon.social
    limit: 20
    rule: trending links/tags 的当日独立账号数 = 社交讨论量（X 无免费 API 时的替代社交信号）
  wikipedia:
    layer: 2
    limit: 25
    rule: 英文维基昨日热读榜：大众注意力确认 + 社会观察供稿；过滤 Main_Page/Special 等元页面
  sitemaps:
    layer: 2
    rule: AI 工具目录站 sitemap 里的新工具页；整组只算一个源（目录站会互相抄）
    # 0.5.0 起改快照 diff：只报上次快照里没有的 URL，同一工具不重复报；
    # 每个目录第一次运行只建基线、不出条目。状态文件可改：
    state_file: state/sitemap-seen.json
    sites:
      - name: futurepedia
        url: "https://www.futurepedia.io/sitemap_tools.xml"
        pattern: '/tool/([^/]+)$'
        max_age_days: 7
      - name: toolify
        url: "https://www.toolify.ai/sitemap.xml"
        shard_pattern: 'sitemap_tools_(\d+)\.xml$'
        shards_to_read: 1
        pattern: 'toolify\.ai/tool/([^/]+)/?$'
      - name: dang.ai
        url: "https://dang.ai/sitemap.xml"
        pattern: 'dang\.ai/([^/]+)$'
        skip: '^(about|advertise|blog|pricing|login|signup)$'
      - name: glama
        url: "https://glama.ai/sitemap.xml"
        shard_patterns: ['mcp-servers/(\d+)\.xml$', 'mcp-remote-servers/(\d+)\.xml$']
        shards_to_read: 2
        pattern: '/mcp/(?:servers|connectors)/(.+)$'
      - name: mcp.so
        url: "https://mcp.so/sitemap.xml"
        shard_pattern: 'section=servers&page=(\d+)$'
        shards_to_read: 2
        pattern: '/servers/([^/]+)$'
      - name: lobehub-mcp
        url: "https://lobehub.com/sitemap/mcp.xml"
        pattern: 'lobehub\.com/mcp/([^/]+)$'
      - name: lobehub-skills
        url: "https://lobehub.com/sitemap/skills.xml"
        pattern: 'lobehub\.com/skills/([^/]+)$'
      - name: aixploria
        url: "https://www.aixploria.com/sitemap.xml"
        shard_pattern: 'sitemap-posttype-post\.(\d{6})\.xml$'
        shards_to_read: 1
        pattern: 'aixploria\.com/([^/]+)/$'
      - name: opentools
        url: "https://opentools.ai/sitemap.xml"
        shard_pattern: '/tools-sitemap\.xml$'
        shards_to_read: 1
        pattern: '/tools/([^/]+)$'
      - name: clipfly
        url: "https://www.clipfly.ai/sitemaps/en.xml"
        pattern: 'clipfly\.ai/(?!pt/|es/|fr/|de/|ja/|ko/|zh/)[a-z0-9-]+/([a-z0-9-]+)/$'
      - name: aitoptools
        url: "https://aitoptools.com/sitemap.xml"
        pattern: '/tool/([^/]+)/?$'
      - name: ai-bot.cn
        url: "https://ai-bot.cn/sitemap.xml"
        pattern: 'ai-bot\.cn/([^/]+)/$'
        skip: '^(about|contact|privacy|terms|submit|sitemap|vipcheap-banner)'
  app_store:
    layer: 2
    country: us
    charts: [top-grossing, top-free]
    limit: 25
    rule: 榜单是钱信号：AI 应用冲进畅销榜 = 有真实付费需求，不只是讨论
  google_news:
    layer: 2
    topics: [technology, ai]
    rule: 同一事件多家报道 = 已进入扩散层
  google_trends:
    layer: 3
    verify_only: true
    rule: 只核对入选话题的曲线形状，永不作为发现来源
